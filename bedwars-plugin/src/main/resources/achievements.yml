# Achievement Settings
settings:
  # Enable achievement system
  enabled: true
  
  # Enable achievement notifications
  notifications: true
  
  # Enable achievement sound effects
  sounds: true
  
  # Enable achievement particle effects
  particles: true
  
  # Enable achievement commands
  commands: true
  
  # Enable achievement statistics
  statistics: true
  
  # Achievement data save interval (in minutes)
  save_interval: 5
  
  # Achievement data save format (JSON, YAML, MYSQL, SQLITE)
  save_format: "JSON"
  
  # Achievement data save location
  save_location: "data/achievements/"