    display_name: "&fGeneral"
    color: "GRAY"
    icon: "PAPER"
    description: "General achievements"
  COMBAT:
    display_name: "&cCombat"
    color: "RED"
    icon: "DIAMOND_SWORD"
    description: "Combat-related achievements"
  BEDS:
